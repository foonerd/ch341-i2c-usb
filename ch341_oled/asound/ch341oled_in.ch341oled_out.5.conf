#------ CH341 OLED ALSA contribution ---------------------------------
#
# Copyright (c) 2026 foonerd
#
# Splits the playback stream two ways: into an ALSA loopback that cava
# reads to compute the spectrum, and onward to the next stage of the
# chain.
#
# Filename syntax is <inPCM>.<outPCM>.<rank>.conf. The backend wires
# pcm.volumio to the first contribution's inPCM and each contribution's
# outPCM to the next, ending at volumioOutput.
#
# Three decisions here are not obvious and all three have cost time:
#
#   The tap terminates at hw:Loopback, not at volumiofifo.
#
#   A multi must find hardware parameters that satisfy both of its
#   slaves at once. Terminating the tap at a userspace plugin puts that
#   plugin's buffer constraints into the negotiation, and on a device
#   with rigid period sizing - a USB DAC behind a softvol was the
#   reported case - no common set exists and ALSA aborts the caller:
#
#     mpd: pcm_params.c:170: snd1_pcm_hw_param_get_min:
#          Assertion `!snd_interval_empty(i)' failed.
#
#   snd_aloop negotiates buffers flexibly, so it follows whatever the
#   output device needs instead of fighting it. This is the terminus
#   used by peppyspectrum and peppymeterbasic, both of which ship on
#   amd64; the peppy_screensaver x64 template states the reason
#   directly: "Loopback has flexible buffer negotiation unlike
#   hw:Dummy".
#
#   The multi is NOT pinned at its outer interface.
#
#   Pinning it to a fixed rate and format also avoids the negotiation
#   problem, and the peppy_screensaver x64 template does exactly that.
#   But it forces both slaves to that rate, so all audio through this
#   plugin would be downsampled. That is acceptable there because it is
#   applied only to the Spotify path, which is 44100/16 at source. It is
#   not acceptable here, where the same multi carries the main output.
#   Hi-res playback must pass through untouched.
#
#   The tap branch alone is pinned to 44100/S16_LE/2.
#
#   Unlike pinning the multi this constrains nothing but the tap. cava
#   reads the loopback capture side and cannot follow a rate that
#   changes per track, so the loopback is held at a fixed rate and the
#   plug converts into it.
#
# Subdevice 1 is used deliberately. The peppy plugins use hw:Loopback
# without a subdevice, which takes the first free one, so pinning to 1
# keeps this plugin out of their way if both are installed.
#
# No FIFO is involved. cava reads the loopback capture side directly,
# which is the mirror of the playback subdevice written here:
#
#   write  hw:Loopback,0,1   ->   read  hw:Loopback,1,1

pcm.ch341oled_in {
    type plug
    slave.pcm "ch341oled_duplex"
}

pcm.ch341oled_duplex {
    type route
    slave.pcm {
        type multi
        slaves.a.pcm "ch341oled_tap"          # spectrum tap
        slaves.a.channels 2
        slaves.b.pcm "ch341oled_out"          # onward, unconverted
        slaves.b.channels 2
        bindings.0.slave a
        bindings.0.channel 0
        bindings.1.slave a
        bindings.1.channel 1
        bindings.2.slave b
        bindings.2.channel 0
        bindings.3.slave b
        bindings.3.channel 1
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}

# Fixed rate and format into the loopback, whatever the output device is
# doing, so cava always finds the capture side at a known configuration.
pcm.ch341oled_tap {
    type plug
    slave {
        pcm "hw:Loopback,0,1"
        rate 44100
        format S16_LE
        channels 2
    }
}

#------ End of CH341 OLED section ------------------------------------
