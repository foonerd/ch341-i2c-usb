#------ CH341 OLED ALSA contribution ---------------------------------
#
# Copyright (c) 2026 foonerd
#
# Filename: <inPCM>.<outPCM>.<rank>.conf
# AAMPP emits pcm.ch341oled_out as type empty and wires it to the next
# stage (softvolume, or volumioOutput). Do not define the out PCM here.
#
# Shape matches the store mpd_oled snippet (volumioalsa.postalsa.5.conf):
# one plug wrapping a multi. That is the form that survives Mixer Type
# Software, None and Hardware. Do not put a rate-forcing plug on one
# slave and a converting plug on the other — the multi then intersects
# S16_LE against S24_3LE and MPD aborts:
#
#   mpd: pcm_params.c:170: snd1_pcm_hw_param_get_min:
#        Assertion `!snd_interval_empty(i)' failed.
#
# volumiofifo, not the stock ALSA "file" plugin. "file" blocks on open
# and will create a regular file if the FIFO is missing.
#
# The FIFO is created by tmpfiles.d and onVolumioStart. volumiofifo
# does not create it.

pcm.ch341oled_in {
    type plug
    slave.pcm {
        type multi
        slaves {
            a { channels 2 pcm "ch341oled_out" }
            b { channels 2 pcm "ch341oled_fifo" }
        }
        bindings {
            0 { slave a channel 0 }
            1 { slave a channel 1 }
            2 { slave b channel 0 }
            3 { slave b channel 1 }
        }
    }
    ttable [
        [ 1 0 1 0 ]
        [ 0 1 0 1 ]
    ]
}

pcm.ch341oled_fifo {
    type volumiofifo
    fifo "/tmp/ch341_oled_fifo"
    format_3 "S16_LE"

    # DO NOT set lead_in_frames. 2048 crashed the audio chain
    # (memset past a buffer). Default is stable.
}

#------ End of CH341 OLED section ------------------------------------
