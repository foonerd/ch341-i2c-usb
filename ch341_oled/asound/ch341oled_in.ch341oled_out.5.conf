#------ CH341 OLED ALSA contribution ---------------------------------
#
# Copyright (c) 2026 foonerd
#
# Tees a copy of the playback stream to a FIFO so that cava can compute
# the spectrum, and passes the audio on unchanged to the next stage of
# the chain.
#
# Filename syntax is <inPCM>.<outPCM>.<rank>.conf. The backend builds
# the chain by wiring pcm.volumio to the first contribution's inPCM and
# each contribution's outPCM to the next, ending at volumioOutput.
#
# Uses the stock ALSA "file" plugin rather than a custom module, so
# there is nothing architecture-specific here and no shared library to
# ship.
#
# KNOWN RISK, still to be verified on hardware: if nothing is reading
# the FIFO, writes to it may block and stall playback. cava is started
# by the plugin and should always be draining it, but a crashed or
# stopped cava is the failure case to test. If this proves a problem the
# alternatives are an ALSA "meter" scope, as peppyspectrum uses, or a
# small custom plugin module.

pcm.ch341oled_in {
    type file
    slave.pcm "ch341oled_out"
    file "/tmp/ch341_oled_fifo"
    format raw
}

#------ End of CH341 OLED section ------------------------------------
