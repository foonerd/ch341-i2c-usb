#------ CH341 OLED ALSA contribution ---------------------------------
#
# Copyright (c) 2026 foonerd
#
# Splits the playback stream two ways: into a FIFO that cava reads to
# compute the spectrum, and onward to the next stage of the chain.
#
# Filename syntax is <inPCM>.<outPCM>.<rank>.conf. The backend wires
# pcm.volumio to the first contribution's inPCM and each contribution's
# outPCM to the next, ending at volumioOutput.
#
# Structure follows the stylish_player and mpd_oled contributions rather
# than being invented here. Two details are not obvious and both matter:
#
#   volumiofifo, not the stock ALSA "file" plugin. Opening a FIFO for
#   writing blocks until a reader attaches, so "file" makes playback
#   depend on cava being up first; it also silently creates a regular
#   file and fills it if no FIFO exists. volumiofifo is Volumio's own
#   plugin for writing a FIFO without blocking the audio path.
#
#   The FIFO branch is wrapped in a plug forcing 44100/S16_LE/2.
#   format_3 on volumiofifo sets the format but not the rate, and cava's
#   fifo input assumes a rate rather than negotiating one, so without
#   this the spectrum is wrong whenever the hardware runs at anything
#   other than 44100.
#
# The FIFO itself is created by the plugin in onStart and removed in
# onStop. volumiofifo does not create it, and the whole chain fails to
# resolve if it is missing.

pcm.ch341oled_in {
    type plug
    slave.pcm "ch341oled_duplex"
}

pcm.ch341oled_duplex {
    type route
    slave.pcm {
        type multi
        slaves.a.pcm "ch341oled_fifo_fixed"   # spectrum tap
        slaves.a.channels 2
        slaves.b.pcm "ch341oled_out"          # onward, unconverted
        slaves.b.channels 2
        bindings.0.slave a
        bindings.0.channel 0
        bindings.1.slave a
        bindings.1.channel 1
        bindings.2.slave b
        bindings.2.channel 0
        bindings.3.slave b
        bindings.3.channel 1
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.0.2 1
    ttable.1.3 1
}

# Fixed rate and format into the FIFO, whatever the hardware is doing.
pcm.ch341oled_fifo_fixed {
    type plug
    slave {
        pcm "ch341oled_fifo"
        rate 44100
        format S16_LE
        channels 2
    }
}

pcm.ch341oled_fifo {
    type volumiofifo
    fifo "/tmp/ch341_oled_fifo"
    format_3 "S16_LE"

    # DO NOT set lead_in_frames here without testing carefully.
    #
    # Setting it to 2048, an eighth of the 16384 the multiroom plugin
    # uses, to reduce the visible lag between audio and the spectrum,
    # caused segfaults inside libc in any process writing to the chain -
    # both mpd and aplay, with a fault pattern consistent with a memset
    # running past the end of a buffer. Audio stopped working.
    #
    # volumiofifo's source is not public, so its buffer sizing rules and
    # any minimum are unknown. The default behaviour is stable and is
    # what this uses.
    #
    # The spectrum lags the audio by roughly a second as a result. The
    # pipe itself was measured holding no more than 100 ms, so the rest
    # is buffering inside volumiofifo or smoothing inside cava. That is
    # a cosmetic issue and not worth crashing playback for.
}

#------ End of CH341 OLED section ------------------------------------
