#------ CH341 OLED ALSA contribution ---------------------------------
#
# Copyright (c) 2026 foonerd
#
# Splits the playback stream two ways: onward to the next stage of the
# chain, and into a FIFO that cava reads to compute the spectrum.
#
# Filename syntax is <inPCM>.<outPCM>.<rank>.conf. The backend wires
# pcm.volumio to the first contribution's inPCM and each contribution's
# outPCM to the next, ending at volumioOutput.
#
# The FIFO branch uses "volumiofifo", Volumio's own ALSA plugin. An
# earlier version of this file used the stock ALSA "file" plugin, which
# is simpler but wrong: opening a FIFO for writing blocks until a reader
# attaches, so on boot MPD would fail with "Failed to open audio output"
# depending on whether cava happened to be up first. volumiofifo exists
# to write a FIFO without blocking the audio path, which is why the
# multiroom and mpd_oled plugins both use it.
#
# The FIFO branch is fixed at S16_LE. cava's fifo input assumes a format
# rather than negotiating one, so without this the spectrum is garbage
# whenever the hardware runs at anything else.

pcm.ch341oled_in {
    type plug
    slave.pcm {
        type multi
        slaves {
            a { channels 2 pcm "ch341oled_out" }
            b { channels 2 pcm "ch341oled_fifo" }
        }
        bindings {
            0 { slave a channel 0 }
            1 { slave a channel 1 }
            2 { slave b channel 0 }
            3 { slave b channel 1 }
        }
    }
    ttable [
        [ 1 0 1 0 ]   # left  -> onward.left,  fifo.left
        [ 0 1 0 1 ]   # right -> onward.right, fifo.right
    ]
}

pcm.ch341oled_fifo {
    type volumiofifo
    fifo "/tmp/ch341_oled_fifo"
    format_3 "S16_LE"
}

#------ End of CH341 OLED section ------------------------------------
